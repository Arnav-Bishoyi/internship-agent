[project]
name = "internship-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.5,<3","google-api-python-client>=2,<3","google-auth-oauthlib>=1.2,<2","keyring>=25,<26","playwright>=1.50,<2","beautifulsoup4>=4.12,<5","pyyaml>=6,<7","requests>=2.32,<3"]
[project.scripts]
internship-agent = "internship_agent.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
